name: Deploy IPA Injector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["Build Nightly release", "Release Tweak"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage tweak payloads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          stage() {
            local channel="$1" tag="$2"
            local dir="site/payload/$channel"
            rm -rf "$dir"
            mkdir -p "$dir"

            if ! gh release view $tag --repo "$REPO" > /dev/null 2>&1; then
              echo "No release for channel '$channel', skipping."
              rm -rf "$dir"
              return 0
            fi

            gh release download $tag \
              --repo "$REPO" \
              --pattern 'ZSingularity.dylib' \
              --pattern 'ZSRamDonor.appex.zip' \
              --dir "$dir" \
              --clobber

            if [[ ! -s "$dir/ZSingularity.dylib" ]]; then
              echo "::warning::'$channel' release has no ZSingularity.dylib, skipping."
              rm -rf "$dir"
              return 0
            fi

            local version="" build="" commit=""
            if [[ "$channel" == "nightly" ]]; then
              commit="$(gh release view nightly --repo "$REPO" --json targetCommitish -q .targetCommitish || true)"
              local header=""
              if [[ -n "$commit" ]]; then
                header="$(gh api "repos/$REPO/contents/Core/Version.h?ref=$commit" -H 'Accept: application/vnd.github.raw' || true)"
              fi
              if [[ -z "$header" ]]; then
                header="$(cat Core/Version.h)"
              fi
              part() { printf '%s' "$header" | grep -oE "#define ZS_VERSION_$1 [0-9]+" | grep -oE '[0-9]+$'; }
              version="$(part MAJOR).$(part MINOR).$(part PATCH)"
              build="$(gh release view nightly --repo "$REPO" --json body -q .body | grep -oE 'build [0-9]+' | head -n1 | grep -oE '[0-9]+' || true)"
            else
              local name
              name="$(gh release view --repo "$REPO" --json tagName -q .tagName)"
              version="${name#v}"
            fi

            local dylib_sha appex_sha="" appex_file=""
            dylib_sha="$(sha256sum "$dir/ZSingularity.dylib" | cut -d' ' -f1)"
            if [[ -s "$dir/ZSRamDonor.appex.zip" ]]; then
              appex_sha="$(sha256sum "$dir/ZSRamDonor.appex.zip" | cut -d' ' -f1)"
              appex_file="ZSRamDonor.appex.zip"
            fi

            jq -n \
              --arg channel "$channel" \
              --arg version "$version" \
              --arg build "$build" \
              --arg commit "$commit" \
              --arg dylib_sha "$dylib_sha" \
              --arg appex_file "$appex_file" \
              --arg appex_sha "$appex_sha" \
              '{
                channel: $channel,
                version: $version,
                build: (if $build == "" then null else $build end),
                commit: (if $commit == "" then null else $commit end),
                dylib: {file: "ZSingularity.dylib", sha256: $dylib_sha},
                appex: (if $appex_file == "" then null else {file: $appex_file, sha256: $appex_sha} end)
              }' > "$dir/manifest.json"
          }

          stage latest ""
          stage nightly nightly
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
